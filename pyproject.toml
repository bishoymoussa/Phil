[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phillm"
version = "0.1.0"
description = "PhiLLM: Physics + LLMs — next-state prediction, probing, and tool calling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bishoy Galoaa" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.7",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "jsonlines>=4.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "huggingface_hub>=0.24",
  "datasets>=2.20",
  "safetensors>=0.4",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.51",
  "accelerate>=0.33",
  "peft>=0.13",
  "trl>=0.12",
  "bitsandbytes>=0.43",
]
infer = [
  "vllm>=0.6",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
space = [
  "gradio>=4.44",
]

[project.scripts]
phil-generate = "phil.data.generate:main"
phil-eval = "phil.eval.eval:main"

[tool.setuptools.packages.find]
include = ["phil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
