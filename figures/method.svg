<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">PhiLLM method: LoRA next-state prediction and ridge probes for physics</title>
  <desc id="desc">
    Flow from a Newtonian simulator through ID and OOD tasks into Qwen3.5-2B,
    then two parallel paths: H1 LoRA for behavioral next-state prediction,
    and H2 ridge probes on hidden states for stated versus derived physics quantities.
  </desc>

  <defs>
    <style type="text/css"><![CDATA[
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap");
      .title { font-family: Literata, "Times New Roman", serif; font-weight: 600; font-size: 22px; fill: #1a1f24; }
      .subtitle { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; font-weight: 400; font-size: 12px; fill: #5c656e; }
      .node { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; font-weight: 600; font-size: 13.5px; fill: #1a1f24; }
      .sub { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; font-weight: 400; font-size: 11px; fill: #5c656e; }
      .path { font-family: Literata, "Times New Roman", serif; font-weight: 600; font-size: 13px; fill: #245b6b; }
      .tiny { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; font-weight: 400; font-size: 10.5px; fill: #6a737c; }
      .ink { stroke: #1a1f24; fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto">
      <path d="M 1 1.2 L 9 5 L 1 8.8 z" fill="#1a1f24"/>
    </marker>
  </defs>

  <rect width="1000" height="420" fill="#ffffff"/>

  <text x="40" y="36" class="title">PhiLLM</text>
  <text x="40" y="56" class="subtitle">Simulator data &#8594; base model &#8594; two tests of physics understanding</text>

  <!-- ===== trunk ===== -->
  <circle cx="90" cy="160" r="4" fill="#1a1f24"/>
  <text x="90" y="132" text-anchor="middle" class="node">Simulator</text>
  <text x="90" y="147" text-anchor="middle" class="sub">Newtonian / Euler</text>

  <line class="ink" x1="94.5" y1="160" x2="248" y2="160" marker-end="url(#arr)"/>

  <circle cx="270" cy="160" r="4" fill="#1a1f24"/>
  <text x="270" y="132" text-anchor="middle" class="node">Tasks T1&#8211;T3</text>
  <text x="270" y="147" text-anchor="middle" class="sub">ID &#183; OOD</text>
  <text x="270" y="192" text-anchor="middle" class="tiny">WorldSpec &#8594; next-state targets</text>

  <line class="ink" x1="274.5" y1="160" x2="418" y2="160" marker-end="url(#arr)"/>

  <circle cx="440" cy="160" r="4.8" fill="#245b6b"/>
  <text x="440" y="132" text-anchor="middle" class="node">Qwen3.5-2B</text>
  <text x="440" y="147" text-anchor="middle" class="sub">base LLM</text>

  <!-- bracket fork: down, then split up/down -->
  <path class="ink" d="M 440 165 L 440 230"/>
  <path class="ink" d="M 440 230 L 560 230"/>
  <path class="ink" d="M 560 110 L 560 350"/>
  <line class="ink" x1="560" y1="110" x2="612" y2="110" marker-end="url(#arr)"/>
  <line class="ink" x1="560" y1="350" x2="612" y2="350" marker-end="url(#arr)"/>

  <!-- ===== H1 ===== -->
  <text x="624" y="82" class="path">H1 &#183; behavior</text>
  <text x="624" y="97" class="tiny">adapt on ID train</text>

  <circle cx="630" cy="110" r="4" fill="#1a1f24"/>
  <text x="630" y="132" text-anchor="middle" class="node">LoRA</text>
  <text x="630" y="146" text-anchor="middle" class="sub">low-rank SFT</text>

  <line class="ink" x1="634.5" y1="110" x2="748" y2="110" marker-end="url(#arr)"/>

  <circle cx="770" cy="110" r="4" fill="#1a1f24"/>
  <text x="770" y="132" text-anchor="middle" class="node">Next-state pred.</text>
  <text x="770" y="146" text-anchor="middle" class="sub">JSON / SI units</text>
  <text x="700" y="172" text-anchor="middle" class="tiny">Does fine-tuning yield transferable dynamics?</text>

  <!-- ===== H2 ===== -->
  <text x="624" y="322" class="path">H2 &#183; representation</text>
  <text x="624" y="337" class="tiny">readout without weight updates</text>

  <circle cx="630" cy="350" r="4" fill="#1a1f24"/>
  <text x="630" y="372" text-anchor="middle" class="node">Hidden states</text>
  <text x="630" y="386" text-anchor="middle" class="sub">layer activations</text>

  <line class="ink" x1="634.5" y1="350" x2="748" y2="350" marker-end="url(#arr)"/>

  <circle cx="770" cy="350" r="4" fill="#1a1f24"/>
  <text x="770" y="372" text-anchor="middle" class="node">Ridge probes</text>
  <text x="770" y="386" text-anchor="middle" class="sub">+ L0 / input controls</text>

  <line class="ink" x1="774.5" y1="350" x2="848" y2="350"/>

  <!-- stated / derived endpoints -->
  <path class="ink" d="M 848 350 L 868 328"/>
  <path class="ink" d="M 848 350 L 868 372"/>
  <line class="ink" x1="868" y1="328" x2="882" y2="328" marker-end="url(#arr)"/>
  <line class="ink" x1="868" y1="372" x2="882" y2="372" marker-end="url(#arr)"/>

  <circle cx="892" cy="328" r="3.5" fill="#245b6b"/>
  <circle cx="892" cy="372" r="3.5" fill="#1a1f24"/>

  <text x="906" y="325" class="node" font-size="12.5px">Stated</text>
  <text x="906" y="339" class="tiny">m, x&#8320;, v&#8320;, F</text>
  <text x="906" y="369" class="node" font-size="12.5px">Derived</text>
  <text x="906" y="383" class="tiny">a, x&#8342;, v&#8342;, p, KE</text>

  <text x="700" y="408" text-anchor="middle" class="tiny">Is physics linearly decodable from representations?</text>
</svg>
